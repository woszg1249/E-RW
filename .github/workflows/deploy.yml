name: CI/CD – Test, Build & Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── JOB 1: Test & Build (CI) ───────────────────────────────────────────────
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, gd
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate App Key
        run: php artisan key:generate

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Run Backend Tests
        run: php artisan test --compact

  # ─── JOB 2: Deploy ke VPS Ubuntu Produksi ────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: success()

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            SSH_USER="$(whoami)"
            APP_OWNER="$(stat -c '%U' "$APP_DIR")"

            echo "▶ Target Directory : $APP_DIR"
            echo "▶ Current SSH User : $SSH_USER"
            echo "▶ App Folder Owner : $APP_OWNER"

            # Perintah deploy lengkap yang akan dieksekusi di dalam $APP_DIR
            DEPLOY_SCRIPT=$(cat << 'EOF'
            set -e
            cd "$1"
            echo "📁 Menjalankan pembaruan di $(pwd) sebagai $(whoami)..."
            
            git config core.fileMode false
            rm -f package-lock.json
            git fetch origin main
            git reset --hard origin/main
            
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            
            npm ci --no-audit --no-fund
            npm run build
            
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache
            
            echo "🎉 Deployment ke VPS Berhasil Selesai!"
            EOF
            )

            if [ "$SSH_USER" = "$APP_OWNER" ]; then
              bash -c "$DEPLOY_SCRIPT" _ "$APP_DIR"
            else
              echo "⚙️ Menjalankan deploy via sudo -u $APP_OWNER agar permission CloudPanel terjaga..."
              sudo -u "$APP_OWNER" bash -c "$DEPLOY_SCRIPT" _ "$APP_DIR"
            fi
