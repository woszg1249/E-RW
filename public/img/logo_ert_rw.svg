<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Emblem Shield / Rounded Squircle with Shadow -->
  <rect x="15" y="15" width="170" height="170" rx="42" fill="url(#mainGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner glowing border -->
  <rect x="20" y="20" width="160" height="160" rx="37" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Connected Community Network Dots & Lines -->
  <circle cx="50" cy="65" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="65" r="4" fill="#ffffff" opacity="0.6"/>
  <line x1="50" y1="65" x2="80" y2="78" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="150" y1="65" x2="120" y2="78" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Left Smaller House -->
  <path d="M52 135 L52 108 L78 90 L104 108 L104 135 Z" fill="#ffffff" fill-opacity="0.22"/>
  <path d="M48 109 L78 87 L108 109" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Right Smaller House -->
  <path d="M96 135 L96 108 L122 90 L148 108 L148 135 Z" fill="#ffffff" fill-opacity="0.22"/>
  <path d="M92 109 L122 87 L152 109" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Center Main Majestic House (RT RW Core) -->
  <path d="M72 142 L72 98 L100 76 L128 98 L128 142 Z" fill="#ffffff"/>
  <!-- Central Roof -->
  <path d="M66 99 L100 73 L134 99" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Modern Smart Door / Window -->
  <rect x="88" y="112" width="24" height="30" rx="6" fill="url(#mainGrad)"/>
  <circle cx="106" cy="127" r="2.5" fill="#ffffff"/>

  <!-- Digital WiFi / Smart Village Signal on top -->
  <path d="M85 55 A22 22 0 0 1 115 55" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <path d="M91 63 A13 13 0 0 1 109 63" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="69" r="2.5" fill="url(#goldGrad)"/>

  <!-- Foundation / Digital Baseline -->
  <rect x="42" y="145" width="116" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
  <rect x="65" y="156" width="70" height="4" rx="2" fill="url(#goldGrad)"/>
</svg>
